name: Publish compatibility candidate
on:
  push:
    branches: [main]
    paths: ['.publish/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s3ce-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify release payload
        run: python3 scripts/assemble_release.py
      - name: Verify APK signature and identity
        shell: bash
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk_tools/apksigner" verify --verbose --print-certs dist/*.apk | tee dist/signature.txt
          grep -q '3c3d5fdfb1db4082e7e488773c2d59cd56ad77c4bfc0aa2e66076e988f02a0c4' dist/signature.txt
          "$sdk_tools/aapt" dump badging dist/*.apk | tee dist/badging.txt
          grep -q "name='io.github.russianranger.s3ce'" dist/badging.txt
          grep -q "targetSdkVersion:'28'" dist/badging.txt
          cp docs/RELEASE_NOTES.md dist/S3CE-test-instructions.md
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0-compat --json tagName --jq .tagName >/dev/null 2>&1; then
            mkdir existing-release
            gh release download v0.1.0-compat --dir existing-release --pattern '*.apk' --pattern SHA256SUMS
            cmp dist/SHA256SUMS existing-release/SHA256SUMS
            (cd existing-release && sha256sum --check SHA256SUMS)
            echo 'Existing release matches the expected APK; leaving it unchanged.'
          else
            gh release create v0.1.0-compat --title 'S3CE 0.1.0 — experimental Android 13–16 ARM32 compatibility' --prerelease --target "$GITHUB_SHA" --notes-file docs/RELEASE_NOTES.md dist/*.apk dist/SHA256SUMS dist/S3CE-test-instructions.md dist/signature.txt dist/badging.txt
          fi
      - name: Verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download v0.1.0-compat --dir downloaded --pattern '*.apk' --pattern SHA256SUMS
          cd downloaded
          sha256sum --check SHA256SUMS
