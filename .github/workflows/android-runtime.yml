name: Android runtime validation

on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/android-runtime.yml'
      - 'scripts/android_runtime*.py'
      - 'scripts/android_runtime_plan.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3ce-android-runtime
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Initialize validation diagnostics
        shell: bash
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/s3ce-validation-avd"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p build/runtime-evidence "$ANDROID_AVD_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_HOME" "$ANDROID_AVD_HOME" > build/runtime-evidence/setup.txt
      - name: Prepare byte-exact internal APKs
        id: apks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android_runtime_prepare.py 2>&1 | tee -a build/runtime-evidence/setup.txt
      - name: Install Android runtime tools
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build/runtime-evidence/setup.txt) 2>&1
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'build-tools;35.0.0' 'system-images;android-30;google_apis;x86'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name S3CE_VALIDATION --path "$ANDROID_AVD_HOME/S3CE_VALIDATION.avd" --package 'system-images;android-30;google_apis;x86' --device pixel_2
          python3 - <<'PY'
          import os
          from pathlib import Path
          image = Path(os.environ['ANDROID_HOME']) / 'system-images/android-30/google_apis/x86'
          avd_root = Path(os.environ['ANDROID_AVD_HOME'])
          avd = avd_root / 'S3CE_VALIDATION.avd/config.ini'
          values = dict(line.split('=', 1) for line in avd.read_text().splitlines() if '=' in line)
          values.update({'hw.lcd.width': '1080', 'hw.lcd.height': '1920', 'hw.lcd.density': '320',
                         'hw.initialOrientation': 'landscape', 'hw.cpu.ncore': '4', 'hw.ramSize': '3072',
                         'hw.gpu.enabled': 'yes', 'hw.gpu.mode': 'swiftshader_indirect',
                         'hw.audioInput': 'no', 'hw.audioOutput': 'no', 'hw.camera.back': 'none',
                         'hw.camera.front': 'none', 'disk.dataPartition.size': '6442450944',
                         'disk.systemPartition.size': str((image / 'system.img').stat().st_size),
                         'showDeviceFrame': 'no', 'fastboot.forceColdBoot': 'yes'})
          avd.write_text(''.join(f'{key}={value.strip()}\n' for key, value in values.items()))
          (avd_root / 'S3CE_VALIDATION.ini').write_text(
              'avd.ini.encoding=UTF-8\npath=' + str(avd.parent) + '\ntarget=android-30\n')
          print('Configured AVD:', avd)
          print('Original GPT system image bytes:', (image / 'system.img').stat().st_size)
          PY
      - name: Pin Android Emulator 31.1.4
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build/runtime-evidence/setup.txt) 2>&1
          python3 - <<'PY'
          import hashlib, os, urllib.request, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 's3ce-emulator-31.1.4'
          root.mkdir(exist_ok=True)
          archive = root / 'emulator-linux_x64-7920983.zip'
          url = 'https://dl.google.com/android/repository/emulator-linux_x64-7920983.zip'
          with urllib.request.urlopen(url, timeout=90) as source, archive.open('wb') as target:
              while block := source.read(1024 * 1024):
                  target.write(block)
          expected = '5690099ab213a6265bc025d1d2218055e6b9d69414972c13cf2ef1c98a9c4565'
          assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == expected
          with zipfile.ZipFile(archive) as package:
              package.extractall(root)
              for entry in package.infolist():
                  mode = entry.external_attr >> 16
                  if mode:
                      (root / entry.filename).chmod(mode)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ANDROID_SDK_ROOT=' + os.environ['ANDROID_HOME'] + '\n')
              env.write('S3CE_EMULATOR_DIR=' + str(root / 'emulator') + '\n')
              env.write('S3CE_GPU_MODE=swiftshader_indirect\n')
          print('Pinned official Emulator31.1.4 archive SHA256:', expected)
          PY
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$RUNNER_TEMP/s3ce-emulator-31.1.4/emulator/emulator" -no-window -version
          "$RUNNER_TEMP/s3ce-emulator-31.1.4/emulator/emulator" -list-avds
          "$RUNNER_TEMP/s3ce-emulator-31.1.4/emulator/emulator" -accel-check
      - name: Exercise baseline and candidate through real Android input
        env:
          CANDIDATE_APK: ${{ steps.apks.outputs.candidate }}
          BASELINE_APK: ${{ steps.apks.outputs.baseline }}
        run: |
          python3 scripts/android_runtime.py --avd S3CE_VALIDATION --candidate "$CANDIDATE_APK" --baseline "$BASELINE_APK" --plan scripts/android_runtime_plan.json --output build/runtime-evidence
      - name: Upload screenshots and runtime evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/runtime-evidence/
          if-no-files-found: error
          retention-days: 14
